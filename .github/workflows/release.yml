name: Build signed release
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proof-release
  cancel-in-progress: false

jobs:
  macos:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Require the existing updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"
      - run: npm ci
      - run: cargo fetch --locked
      - run: npm run lint && npm run typecheck && npm test
      - run: cargo test --workspace --all-targets --locked --offline
      - run: cargo check --workspace --locked --offline
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Proof __VERSION__
          releaseBody: 'Codewiz detection and signed in-app updates. Download the DMG to install; existing Proof 0.1.0 installations need this one manual upgrade.'
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin --bundles app,dmg
