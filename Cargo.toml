[workspace]
members = ["crates/proof-core", "crates/proof-observer", "src-tauri"]
default-members = ["crates/proof-core"]
resolver = "2"

[workspace.package]
version = "0.1.12"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
