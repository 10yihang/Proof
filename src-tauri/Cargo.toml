[package]
name = "proof-desktop"
version.workspace = true
edition.workspace = true
default-run = "proof"

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "proof"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
proof-core = { path = "../crates/proof-core" }
proof-observer = { path = "../crates/proof-observer" }
notify = "8.2.0"
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSResponder"] }
