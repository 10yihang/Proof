[package]
name = "proof-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
jsonc-parser = { version = "0.33.1", features = ["serde"] }
regex = "1"
thiserror.workspace = true
sha2.workspace = true
uuid.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
wait-timeout = "0.2"
plist = { version = "=1.10.1", features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rusqlite = { workspace = true, features = ["hooks"] }

[[example]]
name = "ui-fixture-driver"
path = "../../tests/support/ui-fixture-driver.rs"
